<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Librería Central Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-slate-900 shadow-lg">
        <nav class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{% url 'catalogo' %}" class="text-2xl font-bold text-white hover:text-emerald-400 transition">
                📖 Librería Central Virtual
            </a>
            <div class="flex items-center gap-3">
                {% if perms.catalogo.add_libro %}
                    <a href="{% url 'crear' %}" class="hidden sm:inline-block bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                        + Añadir libro
                    </a>
                {% endif %}
                {% if user.is_authenticated %}
                    <span class="text-slate-300 text-sm hidden md:inline">{{ user.username }}</span>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                            Salir
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'registro' %}" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                        Crear cuenta
                    </a>
                    <a href="{% url 'login' %}" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                        Iniciar sesión
                    </a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
        {% block contenido_dinamico %}{% endblock %}
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center text-sm py-4">
        📖 Librería Central Virtual · CRUD en Django
    </footer>
</body>
</html>
