{% extends 'base.html' %}
{% block contenido_dinamico %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden border border-red-200">
        <div class="bg-red-500 px-6 py-4">
            <h2 class="text-2xl font-bold text-white">⚠️ Confirmar borrado</h2>
        </div>

        <div class="p-6">
            <p class="text-slate-700 text-lg mb-6">
                ¿Estás seguro de que deseas borrar el libro
                <span class="font-bold text-red-600">"{{ libro.titulo }}"</span>?
            </p>
            <p class="text-sm text-slate-400 mb-6">
                Esta acción es definitiva y no se puede deshacer.
            </p>

            <form method="POST" class="flex justify-end gap-2">
                {% csrf_token %}
                <a href="{% url 'catalogo' %}" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-5 py-2 rounded-lg transition text-sm">
                    Cancelar
                </a>
                <button type="submit" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-5 py-2 rounded-lg transition">
                    🗑️ Sí, borrar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
